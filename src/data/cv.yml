    Interests:
      - name: AI and machine learning
        keywords: "Language-model architectures and training, diffusion models and score/flow matching, reinforcement learning, neural operators, and efficient neural-network implementation."

      - name: Probabilistic modeling and inference
        keywords: "Differentiable particle filtering, state-space models, Bayesian inference, Hamiltonian Monte Carlo, stochastic processes, and optimal transport."

      - name: High-performance computing
        keywords: "GPU programming, CUDA and Triton kernels, memory-efficient computation, numerical algorithms, and performance profiling."

      - name: Theoretical and computational physics
        keywords: "High-energy QCD, quantum information and entanglement in field theory, renormalization group, and Monte Carlo simulation."

    Projects:
      - name: Transformer language models from scratch
        category: Machine learning
        highlights:
          - "Implemented attention-based encoder and decoder architectures from scratch in TensorFlow."
          - "Reproduced GPT-2 in PyTorch, checked it against pretrained Hugging Face weights, and fine-tuned it for text classification."

      - name: Differentiable particle filtering for state-space models
        category: Statistical inference
        url: https://github.com/HaowuDuan/hmc_ot_torch
        highlights:
          - "Built a PyTorch library for continuous state-space models with Kalman, extended and unscented Kalman, bootstrap particle, and deterministic and stochastic particle-flow filters, with applications to stochastic-volatility and tracking models."
          - "Made particle resampling differentiable using entropy-regularized Sinkhorn transport and derived implicit gradients at the fixed point."
          - "Combined the filters with Hamiltonian Monte Carlo for Bayesian parameter inference; checked posteriors against an exact Kalman reference and recovered observation-noise parameters with multi-chain rank-normalized R-hat ≤ 1.01."
          - "Reduced likelihood-and-gradient evaluation from 42.5 s to 0.52 s (82×) on a stochastic-volatility benchmark using fused Triton kernels, specialized gradients, and GPU graph replay, compared with the initial PyTorch implementation."

      - name: Memory optimization of a physics-informed neural network
        category: Machine learning
        highlights:
          - "Identified and reduced the training memory bottleneck so a model that required an 80 GB A800 could train on a 24 GB RTX 3090."
          - "Fused the main loss evaluation into CUDA kernels, speeding up that computation by 5×."

      - name: GPU optimization of a lattice Langevin simulation
        category: Scientific computing
        url: https://github.com/HaowuDuan/jimwlk_fast
        highlights:
          - "Ported a NumPy simulation of Langevin evolution of SU(3) fields to CuPy. Nsight Compute profiling identified batched 3 × 3 matrix multiplications as the main bottleneck, accounting for 95% of GPU time at 8% occupancy."
          - "Developed fused CUDA kernels for complex matrix multiplication, Cayley–Hamilton matrix exponentials, and Fourier-space convolution, using mixed FP32/FP64 precision and batching across simulation steps."
          - "Reduced evolution-step time from 1466 ms to 8.6 ms (170×) and kernel launches from 499 to 13 on an RTX 3090, preserving agreement with baseline observables. A standalone SU(3) matrix-exponential kernel achieved a 72× speedup."
        links:
          - label: SU(3) matrix-exponential kernel
            url: https://github.com/HaowuDuan/SU-3-matrix-exp-kernel

      - name: Numerical methods for a six-dimensional Fourier integral
        category: Numerical methods
        url: https://github.com/HaowuDuan/FFT_filon
        highlights:
          - "Designed an algorithm for a six-dimensional Fourier integral in a QCD dijet cross-section, reducing dense integration at every momentum to a reusable table and two one-dimensional Hankel transforms."
          - "Derived Filon quadrature with analytic Bessel moments whose cost is independent of oscillation frequency; implemented momentum-grid sweeps as batched GPU tensor contractions and checked CPU/GPU agreement and convergence."
          - "Built the table with fused FP64 CUDA kernels, cuBLAS matrix multiplication, and chunking to fit GPU memory. The original build took 10 minutes on an RTX 3090; the revised build took 28 seconds on an A800."

      - name: Technical notes and independent study
        category: Writing
        highlights:
          - "Write and maintain notes on language-model architectures and training, CUDA programming and GPU performance, diffusion models, reinforcement learning, and optimal transport."
          - "Develop explanations from first principles, with detailed derivations supported by diagrams, code examples, and profiling experiments."
        links:
