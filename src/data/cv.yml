  summary: I am a computational researcher interested in AI and machine learning, probabilistic modeling, and high-performance computing. I build neural networks, develop differentiable filtering and Bayesian inference methods, and optimize numerical workloads with CUDA and Triton. I also write technical notes on language models, diffusion models, reinforcement learning, and GPU computing. My background is in theoretical and computational physics, with a PhD from North Carolina State University and postdoctoral research at the University of Connecticut.

